services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: vendamusica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendamusica
      POSTGRES_USER: vendamusica_user
      POSTGRES_PASSWORD: vendamusica_dev_2026
    ports:
      # 5433 no host: a 5432 costuma estar ocupada por outro projeto.
      - "5433:5432"
    volumes:
      - vendamusica_postgres_data:/var/lib/postgresql/data

volumes:
  vendamusica_postgres_data:
